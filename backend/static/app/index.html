        /* Consistent pointer feedback for interactive controls */
        button:not(:disabled), a[href], select:not(:disabled), label[for] { cursor: pointer; }

        button:focus-visible, a[href]:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible {

        input[type="range"]:not(:disabled) { cursor: ew-resize; }
        #timelineContainer { cursor: crosshair; }
        #timelineContainer [data-seg-id] { cursor: grab; }
        #timelineContainer [data-seg-id]:active { cursor: grabbing; }
        #timelineContainer .resize-handle-left,
        #timelineContainer .resize-handle-right { cursor: ew-resize !important; }
